name: 构建全平台发布产物

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/build-Linux.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  android:
    uses: ./.github/workflows/build-Android.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  macos:
    uses: ./.github/workflows/build-MacOS.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  ios:
    uses: ./.github/workflows/build-iOS.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  windows:
    uses: ./.github/workflows/build-Windows.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  summary:
    needs:
      - linux
      - android
      - macos
      - ios
      - windows
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 生成构建概览看板
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          format_status() {
            case "$1" in
              success) echo "✅ 成功" ;;
              failure) echo "❌ 失败" ;;
              cancelled) echo "🚫 已取消" ;;
              skipped) echo "⏭️ 跳过" ;;
              *) echo "❓ $1" ;;
            esac
          }

          {
            echo "## 全平台构建状态概览"
            echo
            echo "- 触发 Commit：\`$COMMIT_SHA\`"
            echo
            echo "| 平台 | 构建状态 | 产物 Artifact 名称 | 包含格式 |"
            echo "| --- | --- | --- | --- |"
            echo "| Linux | $(format_status "$LINUX_RESULT") | \`Linux-deb\` / \`Linux-rpm\` | DEB, RPM |"
            echo "| Android | $(format_status "$ANDROID_RESULT") | \`Android-apk\` | APK |"
            echo "| macOS | $(format_status "$MACOS_RESULT") | \`Mac-dmg\` | DMG |"
            echo "| iOS | $(format_status "$IOS_RESULT") | \`IOS-ipa\` | IPA |"
            echo "| Windows | $(format_status "$WINDOWS_RESULT") | \`Win-exe\` / \`Win-msi\` | EXE, MSI |"
            echo
            echo "产物已作为独立 Artifact 上传，可直接在当前 Actions 运行页面下载对应的目标格式。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$LINUX_RESULT" != "success" || "$ANDROID_RESULT" != "success" || "$MACOS_RESULT" != "success" || "$IOS_RESULT" != "success" || "$WINDOWS_RESULT" != "success" ]]; then
            echo "部分平台构建未成功完成。" >&2
            exit 1
          fi
