name: 构建全平台发布产物

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/build-Linux.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  android:
    uses: ./.github/workflows/build-Android.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  macos:
    uses: ./.github/workflows/build-MacOS.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  ios:
    uses: ./.github/workflows/build-iOS.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  windows:
    uses: ./.github/workflows/build-Windows.yml
    with:
      clean_cache: ${{ inputs.clean_cache || false }}

  summary:
    needs:
      - linux
      - android
      - macos
      - ios
      - windows
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 生成构建概览看板
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          format_status() {
            case "$1" in
              success) echo "✅ 成功" ;;
              failure) echo "❌ 失败" ;;
              cancelled) echo "🚫 已取消" ;;
              skipped) echo "⏭️ 跳过" ;;
              *) echo "❓ $1" ;;
            esac
          }

          {
            echo "## 全平台构建状态概览"
            echo
            echo "- 触发 Commit：\`$COMMIT_SHA\`"
            echo
            echo "| 平台 | 构建状态 | 产物 Artifact 名称 | 包含格式 |"
            echo "| --- | --- | --- | --- |"
            echo "| Linux | $(format_status "$LINUX_RESULT") | \`Linux-deb\` / \`Linux-rpm\` | DEB, RPM |"
            echo "| Android | $(format_status "$ANDROID_RESULT") | \`Android-apk\` | APK |"
            echo "| macOS | $(format_status "$MACOS_RESULT") | \`Mac-dmg\` | DMG |"
            echo "| iOS | $(format_status "$IOS_RESULT") | \`IOS-ipa\` | IPA |"
            echo "| Windows | $(format_status "$WINDOWS_RESULT") | \`Win-exe\` / \`Win-msi\` | EXE, MSI |"
            echo
            echo "产物已作为独立 Artifact 上传，可直接在当前 Actions 运行页面下载对应的目标格式。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$LINUX_RESULT" != "success" || "$ANDROID_RESULT" != "success" || "$MACOS_RESULT" != "success" || "$IOS_RESULT" != "success" || "$WINDOWS_RESULT" != "success" ]]; then
            echo "部分构建任务未成功完成。" >&2
            exit 1
          fi

  publish:
    needs:
      - summary
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: 下载发布信息与平台产物
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false

      - name: 校验发布信息
        id: info
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          info_path = temp / 'release-artifacts' / 'Release-info' / 'release-info.json'
          if info_path.is_symlink() or not info_path.is_file():
              raise SystemExit('缺少发布信息 Artifact：Release-info')
          info = json.loads(info_path.read_text())
          if info['commitSha'] != os.environ['BUILD_SHA']:
              raise SystemExit('发布信息与当前构建提交不一致')
          version = info['appDisplayVersion']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta)-[0-9a-f]{7}|-rc[1-9][0-9]*)?', version):
              raise SystemExit('应用显示版本格式无效')
          channel = info['releaseChannel']
          if channel not in {'alpha', 'beta', 'rc', 'stable'}:
              raise SystemExit('发布渠道无效')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'display_version={version}\n')
              output.write(f'channel={channel}\n')
          PY

      - name: 校验十一个发布附件
        env:
          DISPLAY_VERSION: ${{ steps.info.outputs.display_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = temp / 'release-artifacts'
          version = re.escape(os.environ['DISPLAY_VERSION'])
          groups = {
              'Android-apk': ('android', rf'multi-bili-android-(arm64|arm32|x86|x64|universal)-{version}\.apk', 5),
              'Mac-dmg': ('macos', rf'multi-bili-macos-(arm64|x64)-{version}\.dmg', 1),
              'IOS-ipa': ('ios', rf'multi-bili-ios-(arm64)-{version}\.ipa', 1),
              'Win-exe': ('windows', rf'multi-bili-windows-(arm64|x64)-{version}\.exe', 1),
              'Win-msi': ('windows', rf'multi-bili-windows-(arm64|x64)-{version}\.msi', 1),
              'Linux-deb': ('linux', rf'multi-bili-linux-(arm64|x64)-{version}\.deb', 1),
              'Linux-rpm': ('linux', rf'multi-bili-linux-(arm64|x64)-{version}\.rpm', 1),
          }
          if {path.name for path in root.iterdir()} != set(groups) | {'Release-info'}:
              raise SystemExit('下载的 Artifact 分组不完整')
          assets = []
          arches = {}
          for group, (platform, pattern, count) in groups.items():
              directory = root / group
              if directory.is_symlink() or not directory.is_dir():
                  raise SystemExit(f'Artifact 目录无效：{group}')
              files = sorted(directory.iterdir())
              if len(files) != count:
                  raise SystemExit(f'Artifact 文件数量不符：{group}')
              for path in files:
                  match = re.fullmatch(pattern, path.name)
                  if path.is_symlink() or not path.is_file() or path.stat().st_size == 0 or not match:
                      raise SystemExit(f'附件类型、版本或内容无效：{path.name}')
                  if platform != 'android':
                      arch = match.group(1)
                      if platform in arches and arches[platform] != arch:
                          raise SystemExit(f'同平台安装包架构不一致：{platform}')
                      arches[platform] = arch
                  assets.append({'path': str(path), 'name': path.name, 'size': path.stat().st_size})
          if len(assets) != 11 or len({item['name'] for item in assets}) != 11:
              raise SystemExit('必须提供十一个不重名的发布附件')
          (temp / 'release-assets.json').write_text(json.dumps(assets))
          PY

      - name: 创建草稿并上传附件
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ steps.info.outputs.display_version }}
          RELEASE_CHANNEL: ${{ steps.info.outputs.channel }}
        run: |
          set -euo pipefail
          # 列表包含草稿；API 失败必须终止，不能当作 Release 不存在。
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
          if jq -e --arg tag "$RELEASE_TAG" 'any(.[][]; .tag_name == $tag)' "$RUNNER_TEMP/existing-releases.json" > /dev/null; then
            echo "Release 已存在（含草稿），请手动处理：$RELEASE_TAG" >&2
            exit 1
          fi
          tag_path="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          gh api --paginate --slurp "repos/$GH_REPO/git/matching-refs/tags/$tag_path" > "$RUNNER_TEMP/tag-refs.json"
          tag_object="$(jq -c --arg ref "refs/tags/$RELEASE_TAG" '[.[][] | select(.ref == $ref)] | if length == 0 then null elif length == 1 then .[0].object else error("重复的 tag") end' "$RUNNER_TEMP/tag-refs.json")"
          if [[ "$tag_object" == 'null' ]]; then
            echo "触发 Tag 已不存在：$RELEASE_TAG" >&2
            exit 1
          fi
          depth=0
          while [[ "$(jq -r '.type' <<< "$tag_object")" == 'tag' ]]; do
            depth=$((depth + 1))
            test "$depth" -le 16
            tag_sha="$(jq -r '.sha' <<< "$tag_object")"
            tag_object="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object')"
          done
          if [[ "$(jq -r '.type' <<< "$tag_object")" != 'commit' || "$(jq -r '.sha' <<< "$tag_object")" != "$BUILD_SHA" ]]; then
            echo "触发 Tag 未指向构建提交：$RELEASE_TAG" >&2
            exit 1
          fi
          create_args=("$RELEASE_TAG" --draft --title "$DISPLAY_VERSION" --notes "" --verify-tag)
          if [[ "$RELEASE_CHANNEL" != 'stable' ]]; then
            create_args+=(--prerelease --latest=false)
          fi
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(jq -r '.[].path' "$RUNNER_TEMP/release-assets.json")
          test "${#assets[@]}" -eq 11
          gh release create "${create_args[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release view "$RELEASE_TAG" --json assets,isDraft,body,url > "$RUNNER_TEMP/uploaded-release.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((temp / 'release-assets.json').read_text())
          release = json.loads((temp / 'uploaded-release.json').read_text())
          if not release['isDraft'] or release['body']:
              raise SystemExit('Release 必须保持草稿且正文为空，停止后续操作')
          actual = release['assets']
          if (len(actual) != 11
                  or {item['name']: item['size'] for item in actual} != {item['name']: item['size'] for item in expected}
                  or any(item['state'] != 'uploaded' for item in actual)):
              raise SystemExit('草稿附件不完整，保留草稿并停止后续操作')
          PY
          printf 'url=%s\n' "$(jq -r '.url' "$RUNNER_TEMP/uploaded-release.json")" >> "$GITHUB_OUTPUT"

      - name: 输出草稿摘要
        env:
          DISPLAY_VERSION: ${{ steps.info.outputs.display_version }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo '## 草稿创建成功'
            printf '\n- 标题：`%s`\n' "$DISPLAY_VERSION"
            printf -- '- Tag：`%s`\n' "$RELEASE_TAG"
            printf -- '- 构建：[运行 %s](%s)\n' "$GITHUB_RUN_ID" "$BUILD_URL"
            printf -- '- Release：[查看草稿](%s)\n' "$RELEASE_URL"
            echo '- 已上传十一个附件。'
            echo '- 请在 GitHub 页面手动填写正文并发布。'
          } >> "$GITHUB_STEP_SUMMARY"
