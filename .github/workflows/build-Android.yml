name: 构建 Android 版本

on:
  workflow_call:
    inputs:
      clean_cache:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装原生播放器工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm meson ninja-build cmake \
            python3 python3-jinja2 python3-markupsafe
          sdkmanager "ndk;28.2.13676358"

      - name: 生成构建缓存键
        id: cache-keys
        shell: bash
        run: |
          set -euo pipefail
          cache_target='android'
          echo "target=$cache_target" >> "$GITHUB_OUTPUT"
          echo "restore=$cache_target-" >> "$GITHUB_OUTPUT"
          echo "save=$cache_target-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: 恢复构建缓存
        id: restore-build
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache/restore@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/android-*
            nativePlayer/build/cache/bundles/android-*
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.restore }}

      # clean_cache 跳过整组恢复，再清空模块原生构建目录。
      - name: 清理原生构建缓存（可选）
        if: ${{ inputs.clean_cache }}
        run: ./gradlew :nativePlayer:clean

      - name: 编译 Android 产物
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease

      - name: 确认构建未修改受控文件
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: 收集并校验构建产物
        id: collect
        shell: bash
        env:
          METADATA_FILE: build/version/build-metadata.json
        run: |
          set -euo pipefail
          if [[ ! -s "$METADATA_FILE" ]]; then
            echo "缺少本地构建元数据 ${METADATA_FILE}，请通过 Gradle 构建任务生成" >&2
            exit 1
          fi
          DISPLAY_VERSION="$(jq -r '.appDisplayVersion' "$METADATA_FILE")"
          BUILD_NUMBER="$(jq -r '.buildNumber' "$METADATA_FILE")"
          export DISPLAY_VERSION BUILD_NUMBER
          shopt -s nullglob
          apk_files=(androidApp/build/outputs/apk/release/*.apk)
          if [[ "${#apk_files[@]}" -ne 5 ]]; then
            echo "期望恰好 5 个 APK，实际为 ${#apk_files[@]}" >&2
            exit 1
          fi

          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer_bin="$(command -v apkanalyzer)"
          else
            apkanalyzer_candidates=("${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"/cmdline-tools/*/bin/apkanalyzer)
            if [[ "${#apkanalyzer_candidates[@]}" -eq 0 ]]; then
              echo '找不到 apkanalyzer，无法反查 APK 原生版本' >&2
              exit 1
            fi
            apkanalyzer_bin="${apkanalyzer_candidates[$((${#apkanalyzer_candidates[@]} - 1))]}"
          fi

          for apk in "${apk_files[@]}"; do
            apk_version_name="$("$apkanalyzer_bin" manifest version-name "$apk")"
            apk_version_code="$("$apkanalyzer_bin" manifest version-code "$apk")"
            if [[ "$apk_version_name" != "$DISPLAY_VERSION" || "$apk_version_code" != "$BUILD_NUMBER" ]]; then
              echo "APK $apk 的 versionName/versionCode 不一致：expected=$DISPLAY_VERSION/$BUILD_NUMBER actual=$apk_version_name/$apk_version_code" >&2
              exit 1
            fi
          done

          mkdir -p staging/android
          declare -A abi_map=(
            ["arm64-v8a"]="arm64"
            ["armeabi-v7a"]="arm32"
            ["x86"]="x86"
            ["x86_64"]="x64"
            ["universal"]="universal"
          )
          matched_count=0
          for apk in "${apk_files[@]}"; do
            filename="$(basename "$apk")"
            for key in "${!abi_map[@]}"; do
              if [[ "$filename" == *"-${key}-"* ]]; then
                target_arch="${abi_map[$key]}"
                cp "$apk" "staging/android/multi-bili-android-${target_arch}-${DISPLAY_VERSION}.apk"
                matched_count=$((matched_count + 1))
                break
              fi
            done
          done
          if [[ "$matched_count" -ne 5 ]]; then
            echo "未能成功识别并映射全部 5 个 APK 架构，成功映射数量：$matched_count" >&2
            exit 1
          fi

      - name: 上传 Android 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Android-apk
          path: staging/android/multi-bili-android-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: 停止 Gradle Daemon
        if: always()
        run: ./gradlew --stop

      # 完整产物发布在目标槽位，构建失败也可保存；同提交条目已存在时沿用。
      - name: 保存构建缓存
        if: ${{ !cancelled() && steps.cache-keys.outputs.save != '' && steps.restore-build.outputs.cache-matched-key != steps.cache-keys.outputs.save }}
        uses: actions/cache/save@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/android-*
            nativePlayer/build/cache/bundles/android-*
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.save }}
