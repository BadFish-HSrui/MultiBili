name: 构建 macOS 版本

on:
  workflow_call:
    inputs:
      clean_cache:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 切换 Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: 安装原生播放器工具链
        run: brew install meson ninja cmake pkgconf nasm jinja2-cli

      - name: 生成构建缓存键
        id: cache-keys
        shell: bash
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) cache_arch=arm64 ;;
            X64) cache_arch=x64 ;;
            *) echo "不支持的 runner 架构：$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          cache_target="macos-$cache_arch"
          echo "target=$cache_target" >> "$GITHUB_OUTPUT"
          echo "restore=$cache_target-" >> "$GITHUB_OUTPUT"
          echo "save=$cache_target-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: 恢复构建缓存
        id: restore-build
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache/restore@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/bundles/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
            ~/.konan
          key: ${{ steps.cache-keys.outputs.restore }}

      # clean_cache 跳过整组恢复，再清空模块原生构建目录。
      - name: 清理原生构建缓存（可选）
        if: ${{ inputs.clean_cache }}
        run: ./gradlew :nativePlayer:clean

      - name: 编译 macOS 产物
        run: |
          set -euo pipefail
          ./gradlew :composeApp:packageDmg

      - name: 收集并校验构建产物
        id: collect
        shell: bash
        env:
          METADATA_FILE: build/version/build-metadata.json
        run: |
          set -euo pipefail
          if [[ ! -s "$METADATA_FILE" ]]; then
            echo "缺少本地构建元数据 ${METADATA_FILE}，请通过 Gradle 构建任务生成" >&2
            exit 1
          fi
          DISPLAY_VERSION="$(jq -r '.appDisplayVersion' "$METADATA_FILE")"
          VERSION_CORE="$(jq -r '.coreVersion' "$METADATA_FILE")"
          BUILD_NUMBER="$(jq -r '.buildNumber' "$METADATA_FILE")"
          export DISPLAY_VERSION VERSION_CORE BUILD_NUMBER
          shopt -s nullglob
          dmg_files=(composeApp/build/compose/binaries/main/dmg/*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            echo "期望恰好一个 DMG，实际为 ${#dmg_files[@]}" >&2
            exit 1
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              desktop_arch='x64'
              ;;
            arm64|aarch64)
              desktop_arch='arm64'
              ;;
            *)
              echo "不支持的 macOS runner 架构：$(uname -m)" >&2
              exit 1
              ;;
          esac
          echo "desktop_arch=$desktop_arch" >> "$GITHUB_OUTPUT"

          mkdir -p staging/macos
          dmg_target="staging/macos/multi-bili-macos-${desktop_arch}-${DISPLAY_VERSION}.dmg"
          cp "${dmg_files[0]}" "$dmg_target"

          dmg_mount="$(mktemp -d)"
          dmg_attached='false'
          cleanup_dmg() {
            if [[ "$dmg_attached" == 'true' ]]; then
              hdiutil detach -quiet "$dmg_mount"
            fi
          }
          trap cleanup_dmg EXIT
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$dmg_mount" "$dmg_target"
          dmg_attached='true'
          dmg_apps=("$dmg_mount"/*.app)
          if [[ "${#dmg_apps[@]}" -ne 1 || ! -f "${dmg_apps[0]}/Contents/Info.plist" ]]; then
            echo "DMG 中期望恰好一个带 Info.plist 的 App，实际为 ${#dmg_apps[@]}" >&2
            exit 1
          fi
          dmg_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${dmg_apps[0]}/Contents/Info.plist")"
          dmg_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${dmg_apps[0]}/Contents/Info.plist")"
          hdiutil detach -quiet "$dmg_mount"
          dmg_attached='false'
          trap - EXIT
          if [[ "$dmg_version" != "$VERSION_CORE" || "$dmg_build" != "$BUILD_NUMBER" ]]; then
            echo "DMG 内 App 的 CFBundleShortVersionString/CFBundleVersion 不一致：expected=$VERSION_CORE/$BUILD_NUMBER actual=$dmg_version/$dmg_build" >&2
            exit 1
          fi

      - name: 确认构建未修改受控文件
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Mac-dmg
          path: staging/macos/multi-bili-macos-*-*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: 停止 Gradle Daemon
        if: always()
        run: ./gradlew --stop

      # 完整产物发布在目标槽位，构建失败也可保存；同提交条目已存在时沿用。
      - name: 保存构建缓存
        if: ${{ !cancelled() && steps.cache-keys.outputs.save != '' && steps.restore-build.outputs.cache-matched-key != steps.cache-keys.outputs.save }}
        uses: actions/cache/save@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/bundles/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
            ~/.konan
          key: ${{ steps.cache-keys.outputs.save }}
