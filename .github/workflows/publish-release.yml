name: 发布 GitHub Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 已成功的全平台构建运行 ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检查构建及 Artifact
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '构建运行 ID 必须为正整数' >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/build-artifacts.json"
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((temp / 'build-run.json').read_text())
          repo = os.environ['GH_REPO']
          run_id = int(os.environ['BUILD_RUN_ID'])
          if (run['id'] != run_id or run['repository']['full_name'] != repo
                  or (run.get('head_repository') or {}).get('full_name') != repo
                  or run['path'] != '.github/workflows/release-build.yml'
                  or run['event'] not in {'push', 'workflow_dispatch'}):
              raise SystemExit('必须选择当前仓库的全平台构建运行')
          if run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit('所选全平台构建尚未成功完成')
          sha = run['head_sha']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('构建提交 SHA 无效')
          pages = json.loads((temp / 'build-artifacts.json').read_text())
          artifacts = [item for page in pages for item in page['artifacts']]
          expected = ['Android-apk', 'Mac-dmg', 'IOS-ipa', 'Win-exe', 'Win-msi', 'Linux-deb', 'Linux-rpm']
          ids = []
          now = datetime.datetime.now(datetime.timezone.utc)
          for name in expected:
              matches = [item for item in artifacts if item['name'] == name]
              if len(matches) != 1:
                  raise SystemExit(f'Artifact 缺失或重复：{name}')
              item = matches[0]
              if item['expired'] or datetime.datetime.fromisoformat(item['expires_at'].replace('Z', '+00:00')) <= now:
                  raise SystemExit(f'Artifact 已过期，请重新构建：{name}')
              if item['size_in_bytes'] <= 0:
                  raise SystemExit(f'Artifact 为空：{name}')
              origin = item.get('workflow_run') or {}
              if origin.get('id') != run_id or origin.get('head_sha') != sha:
                  raise SystemExit(f'Artifact 与构建提交不一致：{name}')
              ids.append(str(item['id']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
              output.write(f'artifact_ids={",".join(ids)}\n')
              output.write(f'build_url={os.environ["GITHUB_SERVER_URL"]}/{repo}/actions/runs/{run_id}\n')
          PY

      - name: 检出构建提交
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 生成版本元数据
        working-directory: source
        run: ./gradlew --no-daemon :writeBuildMetadata

      - name: 准备 Tag、标题和发布正文
        id: version
        working-directory: source
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          metadata = json.loads(pathlib.Path('build/version/build-metadata.json').read_text())
          if metadata['commitSha'] != os.environ['BUILD_SHA']:
              raise SystemExit('版本元数据与构建提交不一致')
          version = metadata['appDisplayVersion']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta)-[0-9a-f]{7}|-rc[1-9][0-9]*)?', version):
              raise SystemExit('应用显示版本格式无效')
          default_tag = f'v{version}'
          tags = subprocess.check_output([
              'git', 'tag', '--points-at', os.environ['BUILD_SHA'], '--format=%(refname:strip=2)',
          ], text=True).splitlines()
          if default_tag in tags:
              tag = default_tag
          elif len(tags) == 1:
              tag = tags[0]
          elif tags:
              raise SystemExit(f'构建提交对应多个 Tag，无法唯一确定发布 Tag：{", ".join(tags)}')
          else:
              tag = default_tag
          properties = subprocess.check_output(['git', 'show', 'HEAD:version.properties']).decode('utf-8')
          channels = re.findall(r'^APP_RELEASE_CHANNEL\s*=\s*(\w+)\s*$', properties, re.MULTILINE)
          if len(channels) != 1 or channels[0] not in {'alpha', 'beta', 'rc', 'stable'}:
              raise SystemExit('发布渠道无效')
          notes_path = pathlib.Path('RELEASE.md')
          if notes_path.is_symlink() or not notes_path.is_file():
              raise SystemExit('构建提交必须包含普通文件 RELEASE.md')
          notes = subprocess.check_output(['git', 'show', 'HEAD:RELEASE.md'])
          if not notes.decode('utf-8').strip():
              raise SystemExit('RELEASE.md 不能为空或仅包含空白')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_bytes(notes)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'display_version={version}\n')
              output.write(f'tag={tag}\n')
              output.write(f'channel={channels[0]}\n')
          PY

      - name: 下载所选构建产物
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          artifact-ids: ${{ steps.build.outputs.artifact_ids }}
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false

      - name: 校验十一个发布附件
        env:
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = temp / 'release-artifacts'
          version = re.escape(os.environ['DISPLAY_VERSION'])
          groups = {
              'Android-apk': ('android', rf'multi-bili-android-(arm64|arm32|x86|x64|universal)-{version}\.apk', 5),
              'Mac-dmg': ('macos', rf'multi-bili-macos-(arm64|x64)-{version}\.dmg', 1),
              'IOS-ipa': ('ios', rf'multi-bili-ios-(arm64)-{version}\.ipa', 1),
              'Win-exe': ('windows', rf'multi-bili-windows-(arm64|x64)-{version}\.exe', 1),
              'Win-msi': ('windows', rf'multi-bili-windows-(arm64|x64)-{version}\.msi', 1),
              'Linux-deb': ('linux', rf'multi-bili-linux-(arm64|x64)-{version}\.deb', 1),
              'Linux-rpm': ('linux', rf'multi-bili-linux-(arm64|x64)-{version}\.rpm', 1),
          }
          if {path.name for path in root.iterdir()} != set(groups):
              raise SystemExit('下载的 Artifact 分组不完整')
          assets = []
          arches = {}
          for group, (platform, pattern, count) in groups.items():
              directory = root / group
              if directory.is_symlink() or not directory.is_dir():
                  raise SystemExit(f'Artifact 目录无效：{group}')
              files = sorted(directory.iterdir())
              if len(files) != count:
                  raise SystemExit(f'Artifact 文件数量不符：{group}')
              for path in files:
                  match = re.fullmatch(pattern, path.name)
                  if path.is_symlink() or not path.is_file() or path.stat().st_size == 0 or not match:
                      raise SystemExit(f'附件类型、版本或内容无效：{path.name}')
                  if platform != 'android':
                      arch = match.group(1)
                      if platform in arches and arches[platform] != arch:
                          raise SystemExit(f'同平台安装包架构不一致：{platform}')
                      arches[platform] = arch
                  assets.append({'path': str(path), 'name': path.name, 'size': path.stat().st_size})
          if len(assets) != 11 or len({item['name'] for item in assets}) != 11:
              raise SystemExit('必须提供十一个不重名的发布附件')
          (temp / 'release-assets.json').write_text(json.dumps(assets))
          PY

      - name: 创建并发布 Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          # 列表包含草稿；API 失败必须终止，不能当作 Release 不存在。
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
          if jq -e --arg tag "$RELEASE_TAG" 'any(.[][]; .tag_name == $tag)' "$RUNNER_TEMP/existing-releases.json" > /dev/null; then
            echo "Release 已存在（含草稿），请手动处理：$RELEASE_TAG" >&2
            exit 1
          fi
          tag_path="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          gh api --paginate --slurp "repos/$GH_REPO/git/matching-refs/tags/$tag_path" > "$RUNNER_TEMP/tag-refs.json"
          tag_object="$(jq -c --arg ref "refs/tags/$RELEASE_TAG" '[.[][] | select(.ref == $ref)] | if length == 0 then null elif length == 1 then .[0].object else error("重复的 tag") end' "$RUNNER_TEMP/tag-refs.json")"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          create_args=("$RELEASE_TAG" --draft --target "$BUILD_SHA" --title "$DISPLAY_VERSION" --notes-file "$NOTES_FILE")
          publish_args=("$RELEASE_TAG" --draft=false)
          if [[ "$tag_object" != 'null' ]]; then
            depth=0
            while [[ "$(jq -r '.type' <<< "$tag_object")" == 'tag' ]]; do
              depth=$((depth + 1))
              test "$depth" -le 16
              tag_sha="$(jq -r '.sha' <<< "$tag_object")"
              tag_object="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object')"
            done
            if [[ "$(jq -r '.type' <<< "$tag_object")" != 'commit' || "$(jq -r '.sha' <<< "$tag_object")" != "$BUILD_SHA" ]]; then
              echo "现有 tag 未指向所选构建提交：$RELEASE_TAG" >&2
              exit 1
            fi
            create_args+=(--verify-tag)
          fi
          if [[ "$RELEASE_CHANNEL" != 'stable' ]]; then
            create_args+=(--prerelease --latest=false)
            publish_args+=(--prerelease --latest=false)
          fi
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(jq -r '.[].path' "$RUNNER_TEMP/release-assets.json")
          test "${#assets[@]}" -eq 11
          gh release create "${create_args[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release view "$RELEASE_TAG" --json assets,isDraft > "$RUNNER_TEMP/uploaded-release.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((temp / 'release-assets.json').read_text())
          release = json.loads((temp / 'uploaded-release.json').read_text())
          actual = release['assets']
          if (not release['isDraft'] or len(actual) != 11
                  or {item['name']: item['size'] for item in actual} != {item['name']: item['size'] for item in expected}
                  or any(item['state'] != 'uploaded' for item in actual)):
              raise SystemExit('草稿附件不完整，保留草稿并停止发布')
          PY
          gh release edit "${publish_args[@]}"
          gh release view "$RELEASE_TAG" --json url,isDraft > "$RUNNER_TEMP/published-release.json"
          jq -e '.isDraft == false' "$RUNNER_TEMP/published-release.json" > /dev/null
          printf 'url=%s\n' "$(jq -r '.url' "$RUNNER_TEMP/published-release.json")" >> "$GITHUB_OUTPUT"

      - name: 输出发布摘要
        env:
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo '## 发布成功'
            printf '\n- 标题：`%s`\n' "$DISPLAY_VERSION"
            printf -- '- Tag：`%s`\n' "$RELEASE_TAG"
            printf -- '- 构建：[运行 %s](%s)\n' "$BUILD_RUN_ID" "$BUILD_URL"
            printf -- '- Release：[查看发布](%s)\n' "$RELEASE_URL"
            echo '- 已上传十一个附件。'
          } >> "$GITHUB_STEP_SUMMARY"
