name: 构建 Windows 版本

on:
  workflow_call:
    inputs:
      clean_cache:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    env:
      # 缓存布局或键形状变更时递增，可用于一次性作废旧条目。
      BOLO_CACHE_VERSION: v2
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 配置 MSYS2 UCRT64 原生工具链
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-python-markupsafe

      - name: 暴露原生工具链
        shell: pwsh
        run: |
          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          if (-not (Test-Path "$msysRoot\ucrt64\bin\gcc.exe")) { throw "MSYS2 UCRT64 工具链未落盘: $msysRoot" }
          "$msysRoot\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$msysRoot\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 键由 shell 计算：GitHub 表达式里无法嵌套 ${{ }}，restore/save 两步必须拿到完全相同的字面键。
      - name: 生成构建缓存键
        id: cache-keys
        shell: bash
        env:
          CLEAN_CACHE: ${{ inputs.clean_cache }}
          CACHE_SUFFIX: ${{ inputs.clean_cache && format('-disabled-{0}', github.run_id) || '' }}
          CACHE_RUNNER: ${{ runner.os }}-${{ runner.arch }}
          NATIVE_SOURCE_HASH: ${{ hashFiles('buildSrc/src/main/kotlin/tv/hsrui/bolo/buildlogic/NativePlayer*.kt', 'buildSrc/build.gradle.kts', 'nativePlayer/build.gradle.kts', 'nativePlayer/dependencies.lock.json', 'nativePlayer/src/**', '.gitmodules') }}
          GRADLE_INPUT_HASH: ${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
        run: |
          set -euo pipefail
          for input in "$NATIVE_SOURCE_HASH" "$GRADLE_INPUT_HASH"; do
            if [[ -z "$input" || "$input" == "null" ]]; then
              echo "无法计算缓存键：缓存输入文件集合为空" >&2
              exit 1
            fi
          done
          # gitlink 的提交变化不会被上面的文件 glob 捕获，必须单独加入原生输入身份。
          FFMPEG_COMMIT="$(git -C nativePlayer/vendor/ffmpeg rev-parse HEAD)"
          MPV_COMMIT="$(git -C nativePlayer/vendor/mpv rev-parse HEAD)"
          NATIVE_SOURCE_HASH="$(printf '%s\n' "$NATIVE_SOURCE_HASH" "$FFMPEG_COMMIT" "$MPV_COMMIT" | git hash-object --stdin)"
          # 恢复键：clean_cache 时用 -disabled-<run_id> 让恢复必定落空（本次不使用缓存）
          echo "native=$CACHE_RUNNER-windows-native-$BOLO_CACHE_VERSION-$NATIVE_SOURCE_HASH$CACHE_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "gradle=$CACHE_RUNNER-gradle-$BOLO_CACHE_VERSION-$GRADLE_INPUT_HASH$CACHE_SUFFIX" >> "$GITHUB_OUTPUT"
          # 保存键：本平台缓存的真实键，clean_cache 时同样尝试保存；已有条目不可覆盖
          echo "native-save=$CACHE_RUNNER-windows-native-$BOLO_CACHE_VERSION-$NATIVE_SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "gradle-save=$CACHE_RUNNER-gradle-$BOLO_CACHE_VERSION-$GRADLE_INPUT_HASH" >> "$GITHUB_OUTPUT"

      - name: 恢复原生播放器缓存
        id: restore-native
        uses: actions/cache/restore@v4
        with:
          path: |
            nativePlayer/build/cache/downloads/*.tar.gz
            nativePlayer/build/cache/libraries/*/*
            nativePlayer/build/cache/bundles/*/*
            !nativePlayer/build/cache/**/.staging-*/**
          key: ${{ steps.cache-keys.outputs.native }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.native }}

      - name: 恢复 Gradle 缓存
        id: restore-gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.gradle }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.gradle }}

      # 清空模块原生构建目录：恢复键已带 -disabled-<run_id>，Gradle 依赖缓存无需清理。
      - name: 清理原生构建缓存（可选）
        if: ${{ inputs.clean_cache }}
        run: .\gradlew.bat :nativePlayer:clean

      - name: 编译 Windows 安装包
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      - name: 确认构建未修改受控文件
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw '构建修改了受控文件' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw '构建修改了暂存文件' }

      - name: 收集并校验构建产物
        id: collect
        shell: pwsh
        env:
          METADATA_FILE: build/version/build-metadata.json
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:METADATA_FILE -PathType Leaf)) {
            throw "缺少本地构建元数据 $env:METADATA_FILE，请通过 Gradle 构建任务生成"
          }
          $buildMetadata = Get-Content -Raw $env:METADATA_FILE | ConvertFrom-Json
          $env:DISPLAY_VERSION = $buildMetadata.appDisplayVersion
          $env:VERSION_CORE = $buildMetadata.coreVersion
          $env:BUILD_NUMBER = [string]$buildMetadata.buildNumber
          $msiFiles = @(Get-ChildItem 'composeApp/build/compose/binaries/main/msi' -Filter '*.msi' -File)
          $exeFiles = @(Get-ChildItem 'composeApp/build/compose/binaries/main/exe' -Filter '*.exe' -File)
          if ($msiFiles.Count -ne 1 -or $exeFiles.Count -ne 1) {
            throw "期望恰好一个 MSI 和 EXE，实际为 $($msiFiles.Count)/$($exeFiles.Count)"
          }
          if (-not (Test-Path 'build/version/build-metadata.json' -PathType Leaf)) {
            throw '缺少构建元数据 build-metadata.json'
          }

          $desktopArch = switch ($env:PROCESSOR_ARCHITECTURE) {
            'AMD64' { 'x64' }
            'ARM64' { 'arm64' }
            default { throw "不支持的 Windows runner 架构：$env:PROCESSOR_ARCHITECTURE" }
          }
          "desktop_arch=$desktopArch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          New-Item -ItemType Directory -Force -Path 'staging/windows' | Out-Null
          $msiTarget = "staging/windows/multi-bili-windows-$desktopArch-$env:DISPLAY_VERSION.msi"
          $exeTarget = "staging/windows/multi-bili-windows-$desktopArch-$env:DISPLAY_VERSION.exe"
          Copy-Item $msiFiles[0].FullName $msiTarget
          Copy-Item $exeFiles[0].FullName $exeTarget

          $coreParts = $env:VERSION_CORE.Split('.')
          if ($coreParts.Count -ne 3) {
            throw "无效的 APP_VERSION_CORE：$env:VERSION_CORE"
          }
          $expectedWindowsVersion = "$($coreParts[0]).$($coreParts[1]).$env:BUILD_NUMBER"

          $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
          $database = $windowsInstaller.OpenDatabase((Resolve-Path $msiTarget).Path, 0)
          $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductVersion'")
          $view.Execute()
          $record = $view.Fetch()
          if ($null -eq $record) {
            throw 'MSI Property 表缺少 ProductVersion'
          }
          $msiProductVersion = $record.StringData(1)
          $view.Close()
          if ($msiProductVersion -cne $expectedWindowsVersion) {
            throw "MSI ProductVersion 不一致：expected=$expectedWindowsVersion actual=$msiProductVersion"
          }

          $exeProductVersion = (Get-Item $exeTarget).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($exeProductVersion)) {
            throw 'EXE VersionInfo 缺少 ProductVersion'
          }
          try {
            $parsedExeProductVersion = [System.Version]::Parse($exeProductVersion.Trim())
          } catch {
            throw "EXE ProductVersion 不是数值版本：$exeProductVersion"
          }
          if (
            $parsedExeProductVersion.Major -ne [int]$coreParts[0] -or
            $parsedExeProductVersion.Minor -ne [int]$coreParts[1] -or
            $parsedExeProductVersion.Build -ne [int]$env:BUILD_NUMBER -or
            $parsedExeProductVersion.Revision -notin @(-1, 0)
          ) {
            throw "EXE ProductVersion 不一致：expected=$expectedWindowsVersion[.0] actual=$exeProductVersion"
          }

          foreach ($file in @(Get-Item $msiTarget, $exeTarget)) {
            $signatureStatus = (Get-AuthenticodeSignature $file.FullName).Status.ToString()
            if ($signatureStatus -cne 'NotSigned') {
              throw "产物应为未签名，但 $($file.Name) Authenticode 状态为 $signatureStatus"
            }
          }

      - name: 上传 Windows EXE 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Win-exe
          path: staging/windows/multi-bili-windows-*-*.exe
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Windows MSI 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Win-msi
          path: staging/windows/multi-bili-windows-*-*.msi
          if-no-files-found: error
          retention-days: 7

      - name: 停止 Gradle Daemon
        if: always()
        run: .\gradlew.bat --stop

      # 原生缓存中的每个 bundle 都由 Gradle 侧的指纹与 SHA-256 manifest 校验，
      # 因此构建失败时保存不会让下一次运行误用半成品；保存成功则避免重付整轮原生编译。
      # clean_cache 让本次运行忽略已有缓存，仍按真实键尝试保存；已有同键条目不可覆盖。
      - name: 保存 Gradle 缓存
        if: ${{ !cancelled() && steps.restore-gradle.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.gradle-save }}

      - name: 保存原生播放器缓存
        if: ${{ !cancelled() && steps.restore-native.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            nativePlayer/build/cache/downloads/*.tar.gz
            nativePlayer/build/cache/libraries/*/*
            nativePlayer/build/cache/bundles/*/*
            !nativePlayer/build/cache/**/.staging-*/**
          key: ${{ steps.cache-keys.outputs.native-save }}
