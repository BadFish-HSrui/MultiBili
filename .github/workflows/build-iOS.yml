name: 构建 iOS 版本

on:
  workflow_call:
    inputs:
      clean_cache:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 切换 Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: 安装原生播放器工具链
        run: brew install meson ninja cmake pkgconf nasm jinja2-cli

      - name: 生成构建缓存键
        id: cache-keys
        shell: bash
        run: |
          set -euo pipefail
          cache_target='ios-arm64'
          echo "target=$cache_target" >> "$GITHUB_OUTPUT"
          echo "restore=$cache_target-" >> "$GITHUB_OUTPUT"
          echo "save=$cache_target-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: 恢复构建缓存
        id: restore-build
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache/restore@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/bundles/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
            ~/.konan
          key: ${{ steps.cache-keys.outputs.restore }}

      # clean_cache 跳过整组恢复，再清空模块原生构建目录。
      - name: 清理原生构建缓存（可选）
        if: ${{ inputs.clean_cache }}
        run: ./gradlew :nativePlayer:clean

      - name: 编译无签名 iOS App
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 收集并校验构建产物
        id: collect
        shell: bash
        env:
          METADATA_FILE: build/version/build-metadata.json
        run: |
          set -euo pipefail
          ./gradlew :writeBuildMetadata
          if [[ ! -s "$METADATA_FILE" ]]; then
            echo "缺少本地构建元数据 ${METADATA_FILE}，请通过 Gradle 构建任务生成" >&2
            exit 1
          fi
          DISPLAY_VERSION="$(jq -r '.appDisplayVersion' "$METADATA_FILE")"
          VERSION_CORE="$(jq -r '.coreVersion' "$METADATA_FILE")"
          BUILD_NUMBER="$(jq -r '.buildNumber' "$METADATA_FILE")"
          export DISPLAY_VERSION VERSION_CORE BUILD_NUMBER
          shopt -s nullglob
          app_files=(iosApp/build/Build/Products/Release-iphoneos/*.app)
          if [[ "${#app_files[@]}" -ne 1 ]]; then
            echo "期望恰好一个 iOS App，实际为 ${#app_files[@]}" >&2
            exit 1
          fi

          mkdir -p staging/ios
          ipa_target="staging/ios/multi-bili-ios-arm64-${DISPLAY_VERSION}.ipa"
          ipa_root="$(mktemp -d)"
          mkdir -p "$ipa_root/Payload"
          cp -R "${app_files[0]}" "$ipa_root/Payload/"
          (cd "$ipa_root" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/$ipa_target")

          ipa_inspect="$(mktemp -d)"
          ditto -x -k "$ipa_target" "$ipa_inspect"
          ipa_apps=("$ipa_inspect"/Payload/*.app)
          if [[ "${#ipa_apps[@]}" -ne 1 || ! -f "${ipa_apps[0]}/Info.plist" ]]; then
            echo "IPA 中期望恰好一个带 Info.plist 的 App，实际为 ${#ipa_apps[@]}" >&2
            exit 1
          fi
          ios_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${ipa_apps[0]}/Info.plist")"
          ios_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${ipa_apps[0]}/Info.plist")"
          if [[ "$ios_version" != "$VERSION_CORE" || "$ios_build" != "$BUILD_NUMBER" ]]; then
            echo "IPA 内 App 的 CFBundleShortVersionString/CFBundleVersion 不一致：expected=$VERSION_CORE/$BUILD_NUMBER actual=$ios_version/$ios_build" >&2
            exit 1
          fi

      - name: 确认构建未修改受控文件
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: 上传 iOS 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: IOS-ipa
          path: staging/ios/multi-bili-ios-arm64-*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: 停止 Gradle Daemon
        if: always()
        run: ./gradlew --stop

      # 完整产物发布在目标槽位，构建失败也可保存；同提交条目已存在时沿用。
      - name: 保存构建缓存
        if: ${{ !cancelled() && steps.cache-keys.outputs.save != '' && steps.restore-build.outputs.cache-matched-key != steps.cache-keys.outputs.save }}
        uses: actions/cache/save@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/bundles/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
            ~/.konan
          key: ${{ steps.cache-keys.outputs.save }}
