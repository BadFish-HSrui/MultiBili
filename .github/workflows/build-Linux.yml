name: 构建 Linux 版本

on:
  workflow_call:
    inputs:
      clean_cache:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    env:
      # 缓存布局或键形状变更时递增，可用于一次性作废旧条目。
      BOLO_CACHE_VERSION: v2
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装原生播放器工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm meson ninja-build cmake \
            python3 python3-jinja2 python3-markupsafe fakeroot rpm \
            libpulse-dev libasound2-dev libva-dev libgl-dev libdrm-dev libdisplay-info-dev
          sdkmanager "ndk;28.2.13676358"

      # 键由 shell 计算：GitHub 表达式里无法嵌套 ${{ }}，restore/save 两步必须拿到完全相同的字面键。
      - name: 生成构建缓存键
        id: cache-keys
        shell: bash
        env:
          CLEAN_CACHE: ${{ inputs.clean_cache }}
          CACHE_SUFFIX: ${{ inputs.clean_cache && format('-disabled-{0}', github.run_id) || '' }}
          CACHE_RUNNER: ${{ runner.os }}-${{ runner.arch }}
          NATIVE_SOURCE_HASH: ${{ hashFiles('buildSrc/src/main/kotlin/tv/hsrui/bolo/buildlogic/NativePlayer*.kt', 'buildSrc/build.gradle.kts', 'nativePlayer/build.gradle.kts', 'nativePlayer/dependencies.lock.json', 'nativePlayer/src/**', '.gitmodules') }}
          GRADLE_INPUT_HASH: ${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
        run: |
          set -euo pipefail
          for input in "$NATIVE_SOURCE_HASH" "$GRADLE_INPUT_HASH"; do
            if [[ -z "$input" || "$input" == "null" ]]; then
              echo "无法计算缓存键：缓存输入文件集合为空" >&2
              exit 1
            fi
          done
          # gitlink 的提交变化不会被上面的文件 glob 捕获，必须单独加入原生输入身份。
          FFMPEG_COMMIT="$(git -C nativePlayer/vendor/ffmpeg rev-parse HEAD)"
          MPV_COMMIT="$(git -C nativePlayer/vendor/mpv rev-parse HEAD)"
          NATIVE_SOURCE_HASH="$(printf '%s\n' "$NATIVE_SOURCE_HASH" "$FFMPEG_COMMIT" "$MPV_COMMIT" | git hash-object --stdin)"
          # 恢复键：clean_cache 时用 -disabled-<run_id> 让恢复必定落空（本次不使用缓存）
          echo "native=$CACHE_RUNNER-linux-native-$BOLO_CACHE_VERSION-$NATIVE_SOURCE_HASH$CACHE_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "gradle=$CACHE_RUNNER-gradle-$BOLO_CACHE_VERSION-$GRADLE_INPUT_HASH$CACHE_SUFFIX" >> "$GITHUB_OUTPUT"
          # 保存键：本平台缓存的真实键，clean_cache 时同样尝试保存；已有条目不可覆盖
          echo "native-save=$CACHE_RUNNER-linux-native-$BOLO_CACHE_VERSION-$NATIVE_SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "gradle-save=$CACHE_RUNNER-gradle-$BOLO_CACHE_VERSION-$GRADLE_INPUT_HASH" >> "$GITHUB_OUTPUT"

      - name: 恢复原生播放器缓存
        id: restore-native
        uses: actions/cache/restore@v4
        with:
          path: |
            nativePlayer/build/cache/downloads/*.tar.gz
            nativePlayer/build/cache/libraries/*/*
            nativePlayer/build/cache/bundles/*/*
            !nativePlayer/build/cache/**/.staging-*/**
          key: ${{ steps.cache-keys.outputs.native }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.native }}

      - name: 恢复 Gradle 缓存
        id: restore-gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.gradle }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.gradle }}

      # 清空模块原生构建目录：恢复键已带 -disabled-<run_id>，Gradle 依赖缓存无需清理。
      - name: 清理原生构建缓存（可选）
        if: ${{ inputs.clean_cache }}
        run: ./gradlew :nativePlayer:clean

      - name: 编译 Linux 产物
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:packageDeb \
            :composeApp:packageRpm

      - name: 确认构建未修改受控文件
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: 收集并校验构建产物
        id: collect
        shell: bash
        env:
          METADATA_FILE: build/version/build-metadata.json
        run: |
          set -euo pipefail
          if [[ ! -s "$METADATA_FILE" ]]; then
            echo "缺少本地构建元数据 ${METADATA_FILE}，请通过 Gradle 构建任务生成" >&2
            exit 1
          fi
          DISPLAY_VERSION="$(jq -r '.appDisplayVersion' "$METADATA_FILE")"
          VERSION_CORE="$(jq -r '.coreVersion' "$METADATA_FILE")"
          BUILD_NUMBER="$(jq -r '.buildNumber' "$METADATA_FILE")"
          export DISPLAY_VERSION VERSION_CORE BUILD_NUMBER
          shopt -s nullglob
          deb_files=(composeApp/build/compose/binaries/main/deb/*.deb)
          rpm_files=(composeApp/build/compose/binaries/main/rpm/*.rpm)
          if [[ "${#deb_files[@]}" -ne 1 || "${#rpm_files[@]}" -ne 1 ]]; then
            echo "期望恰好一个 DEB 和 RPM，实际为 ${#deb_files[@]}/${#rpm_files[@]}" >&2
            exit 1
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              desktop_arch='x64'
              ;;
            arm64|aarch64)
              desktop_arch='arm64'
              ;;
            *)
              echo "不支持的 Linux runner 架构：$(uname -m)" >&2
              exit 1
              ;;
          esac
          echo "desktop_arch=$desktop_arch" >> "$GITHUB_OUTPUT"

          deb_version="$(dpkg-deb --field "${deb_files[0]}" Version)"
          rpm_version="$(rpm -qp --queryformat '%{VERSION}' "${rpm_files[0]}")"
          rpm_release="$(rpm -qp --queryformat '%{RELEASE}' "${rpm_files[0]}")"
          if [[ "$deb_version" != "${VERSION_CORE}-${BUILD_NUMBER}" ]]; then
            echo "DEB Version 不一致：expected=${VERSION_CORE}-${BUILD_NUMBER} actual=$deb_version" >&2
            exit 1
          fi
          if [[ "$rpm_version" != "$VERSION_CORE" || "$rpm_release" != "$BUILD_NUMBER" ]]; then
            echo "RPM Version/Release 不一致：expected=$VERSION_CORE/$BUILD_NUMBER actual=$rpm_version/$rpm_release" >&2
            exit 1
          fi

          mkdir -p staging/linux
          deb_target="staging/linux/multi-bili-linux-${desktop_arch}-${DISPLAY_VERSION}.deb"
          rpm_target="staging/linux/multi-bili-linux-${desktop_arch}-${DISPLAY_VERSION}.rpm"
          cp "${deb_files[0]}" "$deb_target"
          cp "${rpm_files[0]}" "$rpm_target"

      - name: 上传 Linux DEB 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Linux-deb
          path: staging/linux/multi-bili-linux-*-*.deb
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Linux RPM 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Linux-rpm
          path: staging/linux/multi-bili-linux-*-*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: 停止 Gradle Daemon
        if: always()
        run: ./gradlew --stop

      # 原生缓存中的每个 bundle 都由 Gradle 侧的指纹与 SHA-256 manifest 校验，
      # 因此构建失败时保存不会让下一次运行误用半成品；保存成功则避免重付整轮原生编译。
      # clean_cache 让本次运行忽略已有缓存，仍按真实键尝试保存；已有同键条目不可覆盖。
      - name: 保存 Gradle 缓存
        if: ${{ !cancelled() && steps.restore-gradle.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.gradle-save }}

      - name: 保存原生播放器缓存
        if: ${{ !cancelled() && steps.restore-native.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            nativePlayer/build/cache/downloads/*.tar.gz
            nativePlayer/build/cache/libraries/*/*
            nativePlayer/build/cache/bundles/*/*
            !nativePlayer/build/cache/**/.staging-*/**
          key: ${{ steps.cache-keys.outputs.native-save }}
