name: 构建 Linux 版本

on:
  workflow_call:
    inputs:
      clean_cache:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理缓存
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装原生播放器工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm meson ninja-build cmake \
            python3 python3-jinja2 python3-markupsafe fakeroot rpm \
            libpulse-dev libasound2-dev libva-dev libgl-dev libdrm-dev libdisplay-info-dev
          sdkmanager "ndk;28.2.13676358"

      - name: 生成构建缓存键
        id: cache-keys
        shell: bash
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) cache_arch=arm64 ;;
            X64) cache_arch=x64 ;;
            *) echo "不支持的 runner 架构：$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          cache_target="linux-$cache_arch"
          echo "target=$cache_target" >> "$GITHUB_OUTPUT"
          echo "restore=$cache_target-" >> "$GITHUB_OUTPUT"
          echo "save=$cache_target-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: 恢复构建缓存
        id: restore-build
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache/restore@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/bundles/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.restore }}

      # clean_cache 跳过整组恢复，再清空模块原生构建目录。
      - name: 清理原生构建缓存（可选）
        if: ${{ inputs.clean_cache }}
        run: ./gradlew :nativePlayer:clean

      - name: 编译 Linux 产物
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:packageDeb \
            :composeApp:packageRpm

      - name: 确认构建未修改受控文件
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: 收集并校验构建产物
        id: collect
        shell: bash
        env:
          METADATA_FILE: build/version/build-metadata.json
        run: |
          set -euo pipefail
          if [[ ! -s "$METADATA_FILE" ]]; then
            echo "缺少本地构建元数据 ${METADATA_FILE}，请通过 Gradle 构建任务生成" >&2
            exit 1
          fi
          DISPLAY_VERSION="$(jq -r '.appDisplayVersion' "$METADATA_FILE")"
          VERSION_CORE="$(jq -r '.coreVersion' "$METADATA_FILE")"
          BUILD_NUMBER="$(jq -r '.buildNumber' "$METADATA_FILE")"
          export DISPLAY_VERSION VERSION_CORE BUILD_NUMBER
          shopt -s nullglob
          deb_files=(composeApp/build/compose/binaries/main/deb/*.deb)
          rpm_files=(composeApp/build/compose/binaries/main/rpm/*.rpm)
          if [[ "${#deb_files[@]}" -ne 1 || "${#rpm_files[@]}" -ne 1 ]]; then
            echo "期望恰好一个 DEB 和 RPM，实际为 ${#deb_files[@]}/${#rpm_files[@]}" >&2
            exit 1
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              desktop_arch='x64'
              ;;
            arm64|aarch64)
              desktop_arch='arm64'
              ;;
            *)
              echo "不支持的 Linux runner 架构：$(uname -m)" >&2
              exit 1
              ;;
          esac
          echo "desktop_arch=$desktop_arch" >> "$GITHUB_OUTPUT"

          deb_version="$(dpkg-deb --field "${deb_files[0]}" Version)"
          rpm_version="$(rpm -qp --queryformat '%{VERSION}' "${rpm_files[0]}")"
          rpm_release="$(rpm -qp --queryformat '%{RELEASE}' "${rpm_files[0]}")"
          if [[ "$deb_version" != "${VERSION_CORE}-${BUILD_NUMBER}" ]]; then
            echo "DEB Version 不一致：expected=${VERSION_CORE}-${BUILD_NUMBER} actual=$deb_version" >&2
            exit 1
          fi
          if [[ "$rpm_version" != "$VERSION_CORE" || "$rpm_release" != "$BUILD_NUMBER" ]]; then
            echo "RPM Version/Release 不一致：expected=$VERSION_CORE/$BUILD_NUMBER actual=$rpm_version/$rpm_release" >&2
            exit 1
          fi

          mkdir -p staging/linux
          deb_target="staging/linux/multi-bili-linux-${desktop_arch}-${DISPLAY_VERSION}.deb"
          rpm_target="staging/linux/multi-bili-linux-${desktop_arch}-${DISPLAY_VERSION}.rpm"
          cp "${deb_files[0]}" "$deb_target"
          cp "${rpm_files[0]}" "$rpm_target"

      # 发布信息供统一入口的发布作业直接复用，避免重新克隆源码或执行 Gradle。
      - name: 生成发布信息
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          metadata = json.loads(pathlib.Path('build/version/build-metadata.json').read_text())
          sha = metadata['commitSha']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('构建提交 SHA 无效')
          properties = pathlib.Path('version.properties').read_text()
          channels = re.findall(r'^APP_RELEASE_CHANNEL\s*=\s*(\w+)\s*$', properties, re.MULTILINE)
          if len(channels) != 1 or channels[0] not in {'alpha', 'beta', 'rc', 'stable'}:
              raise SystemExit('发布渠道无效')
          info = {
              'commitSha': sha,
              'appDisplayVersion': metadata['appDisplayVersion'],
              'releaseChannel': channels[0],
          }
          target = pathlib.Path('staging/release-info.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(info, ensure_ascii=False))
          PY

      - name: 上传发布信息
        uses: actions/upload-artifact@v7
        with:
          name: Release-info
          path: staging/release-info.json
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Linux DEB 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Linux-deb
          path: staging/linux/multi-bili-linux-*-*.deb
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Linux RPM 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Linux-rpm
          path: staging/linux/multi-bili-linux-*-*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: 停止 Gradle Daemon
        if: always()
        run: ./gradlew --stop

      # 完整产物发布在目标槽位，构建失败也可保存；同提交条目已存在时沿用。
      - name: 保存构建缓存
        if: ${{ !cancelled() && steps.cache-keys.outputs.save != '' && steps.restore-build.outputs.cache-matched-key != steps.cache-keys.outputs.save }}
        uses: actions/cache/save@v6
        with:
          path: |
            nativePlayer/build/cache/libraries/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/bundles/${{ steps.cache-keys.outputs.target }}
            nativePlayer/build/cache/downloads/*.tar.gz
            !nativePlayer/build/cache/**/.staging-*/**
            !nativePlayer/build/cache/**/.previous-*/**
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/[0-9]*
            ~/.gradle/wrapper/dists
          key: ${{ steps.cache-keys.outputs.save }}
