name: 打包源码

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 打包源码
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: 配置 JetBrains JBRSDK 25
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 生成版本元数据
        run: ./gradlew --no-daemon :writeBuildMetadata

      - name: 下载并校验锁定的原生依赖源码
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          dependencies = json.loads(pathlib.Path('nativePlayer/dependencies.lock.json').read_text())
          if not isinstance(dependencies, dict) or not dependencies:
              raise SystemExit('Native dependency lockfile must contain source archives')
          directory = pathlib.Path('nativePlayer/build/cache/downloads')
          directory.mkdir(parents=True, exist_ok=True)
          for name, dependency in dependencies.items():
              sha = dependency['sha256']
              url = dependency['url']
              if not re.fullmatch(r'[0-9a-f]{64}', sha) or not url.startswith('https://'):
                  raise SystemExit(f'Invalid source archive entry: {name}')
              archive = directory / f'{sha}.tar.gz'
              if archive.is_symlink():
                  raise SystemExit(f'Source archive must be a regular file: {name}')
              if not archive.is_file() or hashlib.sha256(archive.read_bytes()).hexdigest() != sha:
                  partial = archive.with_suffix('.partial')
                  try:
                      subprocess.run([
                          'curl', '--fail', '--location', '--retry', '3',
                          '--connect-timeout', '20', '--max-time', '600',
                          '--output', str(partial), url,
                      ], check=True)
                      if hashlib.sha256(partial.read_bytes()).hexdigest() != sha:
                          raise SystemExit(f'Source checksum mismatch: {name}')
                      partial.replace(archive)
                  finally:
                      partial.unlink(missing_ok=True)
              print(f'Verified native source archive: {name}')
          PY

      - name: 打包并验证源码
        shell: bash
        env:
          METADATA_FILE: build/version/build-metadata.json
        run: |
          set -euo pipefail
          source_version="$(jq -er '.appDisplayVersion | select(test("^[0-9A-Za-z][0-9A-Za-z.+-]*$"))' "$METADATA_FILE")"
          source_commit="$(jq -er '.commitSha' "$METADATA_FILE")"
          source_count="$(jq -er '.buildNumber' "$METADATA_FILE")"
          test "$source_commit" = "$GITHUB_SHA"
          test "$source_commit" = "$(git rev-parse HEAD)"
          test "$source_count" = "$(git rev-list --count HEAD)"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -d .git
          test -z "$(git status --porcelain --untracked-files=no)"
          git submodule foreach --quiet --recursive '
            test "$(git rev-parse HEAD)" = "$sha1" &&
            test "$(git rev-parse --is-shallow-repository)" = false
          '

          source_name="multi-bili-source-${source_version}"
          source_temp="$(mktemp -d "$RUNNER_TEMP/bolo-source.XXXXXX")"
          trap 'rm -rf "$source_temp"' EXIT
          mkdir -p "$source_temp/stage/$source_name" "$source_temp/verify" staging/source
          source_archive="$GITHUB_WORKSPACE/staging/source/source.tar.gz"
          # 仅复制受控文件、Git 数据和锁定源码归档，不带入其他缓存或构建输出。
          git ls-files --cached --recurse-submodules -z > "$source_temp/files"
          printf '.git\0' >> "$source_temp/files"
          git submodule foreach --quiet --recursive 'printf "%s/.git\0" "$displaypath"' >> "$source_temp/files"
          python3 - <<'PY' >> "$source_temp/files"
          import json
          import pathlib
          import sys

          dependencies = json.loads(pathlib.Path('nativePlayer/dependencies.lock.json').read_text())
          for sha in sorted({dependency['sha256'] for dependency in dependencies.values()}):
              sys.stdout.buffer.write(f'nativePlayer/build/cache/downloads/{sha}.tar.gz\0'.encode())
          PY
          tar --null -T "$source_temp/files" -cf - | tar -xf - -C "$source_temp/stage/$source_name"
          tar -cf - -C "$source_temp/stage" "$source_name" | gzip -9 -n > "$source_archive"
          gzip -t "$source_archive"

          # 解压后核对文件清单与完整 Git 数据，不能依赖 runner 中的原始仓库。
          tar -xzf "$source_archive" -C "$source_temp/verify"
          source_root="$source_temp/verify/$source_name"
          export SOURCE_ROOT="$source_root"
          python3 - "$source_temp/files" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ['SOURCE_ROOT']).resolve()
          expected = set(pathlib.Path(sys.argv[1]).read_bytes().split(b'\0')) - {b'', b'.git'}
          actual = set()
          for directory, folders, files in os.walk(root):
              if pathlib.Path(directory) == root:
                  folders.remove('.git')
              for name in files + [name for name in folders if (pathlib.Path(directory) / name).is_symlink()]:
                  actual.add(os.fsencode((pathlib.Path(directory) / name).relative_to(root)))
          if actual != expected:
              raise SystemExit('Source archive file list does not match tracked files, submodule Git pointers and locked source archives')
          dependencies = json.loads((root / 'nativePlayer/dependencies.lock.json').read_text())
          for name, dependency in dependencies.items():
              sha = dependency['sha256']
              archive = root / f'nativePlayer/build/cache/downloads/{sha}.tar.gz'
              if archive.is_symlink() or not archive.is_file() or hashlib.sha256(archive.read_bytes()).hexdigest() != sha:
                  raise SystemExit(f'Extracted source checksum mismatch: {name}')
          for path in (root / '.git').rglob('*'):
              if path.is_symlink() or path.name in {'alternates', 'http-alternates'}:
                  raise SystemExit('Source archive Git data must be self-contained')
          PY
          test "$source_commit" = "$(git -C "$source_root" rev-parse HEAD)"
          test "$source_count" = "$(git -C "$source_root" rev-list --count HEAD)"
          test "$(git -C "$source_root" rev-parse --is-shallow-repository)" = false
          test -z "$(git -C "$source_root" status --porcelain --untracked-files=all)"
          git -C "$source_root" fsck --full
          git submodule status --recursive > "$source_temp/expected-submodules"
          git -C "$source_root" submodule status --recursive > "$source_temp/actual-submodules"
          cmp "$source_temp/expected-submodules" "$source_temp/actual-submodules"
          git -C "$source_root" submodule foreach --quiet --recursive '
            case "$(git rev-parse --absolute-git-dir)" in
              "$SOURCE_ROOT"/.git/*) ;;
              *) echo "Submodule Git data points outside the source archive" >&2; exit 1 ;;
            esac
            test "$(git rev-parse HEAD)" = "$sha1" &&
            test "$(git rev-parse --is-shallow-repository)" = false &&
            test -z "$(git status --porcelain --untracked-files=all)" &&
            git fsck --full
          '

      - name: 上传源码
        uses: actions/upload-artifact@v4
        with:
          name: Source
          path: staging/source/source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
